name: Web

# Checks of the frontend (web/). Deploying is pages.yml, after "Build notes" has produced the data.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml", ".github/actions/setup-web/**"]
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml", ".github/actions/setup-web/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: 1

jobs:
  checks:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-web

      - run: bun run lint
      - name: Lint must not change files (run `bun run lint` in web/ and commit)
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            exit 1
          fi

      - run: bun run test
      - run: bun run build
