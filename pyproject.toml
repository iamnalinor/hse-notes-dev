[project]
name = "hse-notes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28.2",
    "pypandoc-binary>=1.17",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
